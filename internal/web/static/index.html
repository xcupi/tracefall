<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracefall</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Tracefall <span class="brand-sub">forensic triage</span></a>
    <div class="topbar-right">
      <button type="button" id="theme-toggle" class="theme-toggle" title="Switch between Auto, Light and Dark">Theme</button>
      <span id="timezone-control" class="timezone-control"></span>
      <span id="user-bar" class="user-bar"></span>
      <span id="conn-status" class="conn-status"></span>
    </div>
  </header>
  <div id="lan-warning" class="lan-warning hidden">
    Reachable from other machines on this network. Authentication is required for a non-loopback bind, but traffic is plain HTTP unless you terminate TLS in front of Tracefall &mdash; keep this on a trusted network and never port-forward it to the public internet.
  </div>
  <main id="app" class="app"></main>
  <script src="/static/app.js"></script>
</body>
</html>
